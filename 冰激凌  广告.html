<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰淇淋商品卡片</title>
    <style>
        .card {
            width: 300px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 20px;
        }
        .card-img {
            width: 100%;
            border-radius: 4px;
        }
        .tag {
            position: relative;
            top: -270px;
            left: -10px;
            width: 80px;
            height: 30px;
            background-color: #f00;
            color: #fff;
            text-align: center;
            line-height: 30px;
            transform: rotate(-45deg);
        }
        .card-title {
            font-size: 14px;
            margin: 10px 0;
        }
        .price {
            color: #f00;
            font-size: 20px;
            font-weight: bold;
        }
        .original-price {
            color: #999;
            font-size: 12px;
            text-decoration: line-through;
            margin-left: 5px;
        }
        .btn {
            background-color: #ff9900;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        .buy-count {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">今日推荐</div>
        <img  src="img/adv.jpg" alt="冰淇淋">
        <div class="card-title">【12店通用】领航冰品：冰淇淋双球，口味任选2种，节假通用</div>
        <span class="price">¥20.8 </span>
        <span class="original-price">原价¥38</span>
        <br>
        <button class="btn">去看看</button>
        <span class="buy-count">32人已购买</span>
    </div>
</body>
</html>
